name: CI

# Standards are only real if something enforces them. This runs on every PR and
# every push to main, and must pass before a change reaches the deploy pipeline.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Biome (format + lint + import order)
        run: pnpm check

      - name: ESLint (Next.js rules)
        run: pnpm lint

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds against recorded fixtures and asserts on the exported HTML — the
      # artifact that actually ships. Needs no credentials and no store.
      - name: End-to-end (static export)
        run: pnpm test:e2e

      # The end-to-end step above builds against recorded fixtures, so it
      # proves the export is well-formed without credentials. The build that
      # ships runs in deploy.yml against the real gateway, with the repository
      # variables — and it fails loudly if `out/` is missing.
