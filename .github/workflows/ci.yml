name: CI

# Standards are only real if something enforces them. This runs on every PR and
# every push to main, and must pass before a change reaches the deploy pipeline.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Biome (format + lint + import order)
        run: pnpm check

      - name: ESLint (Next.js rules)
        run: pnpm lint

      # A build here would need live Bacano credentials, so CI stops at the
      # checks that do not. The real build runs in deploy.yml, which has the
      # repository variables — and it fails loudly if `out/` is missing.
